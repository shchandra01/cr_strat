[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cr-strat"
version = "0.1.0"
description = "Research tooling for Indian corporate bond strategies"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pandas>=2.0", "numpy>=1.24", "openpyxl>=3.1"]

[project.optional-dependencies]
xls = ["xlrd>=2.0"]
dev = ["pytest>=7"]

[project.scripts]
cr-strat = "cr_strat.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
